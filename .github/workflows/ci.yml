name: CI

# main への push と Pull Request で、構文チェックと金額計算のゴールデンテストを走らせる。
# 金額が変わる変更（料金改定など）は node tests/run-calc-tests.js --update で
# tests/golden.json を更新してからコミットすること。

on:
  push:
    branches: [main]
  pull_request:
  # 手で流す（main の中身をもう一度配るとき）。配った版を戻すのは Cloudflare の Rollback で行う
  #（Environment「production」は main だけに限っているので、タグや別の枝からは配れない）
  workflow_dispatch:

# 自動実行が持つ権限は「読むだけ」。配信の合鍵（Cloudflare のトークン）は下の deploy ジョブの
# 環境（production）にだけ置き、main 以外の枝からは使えない（GitHub の Environment の枝制限）。
permissions:
  contents: read

# 同じ PR に続けて push したときは、古い実行を止める（Actions の分数の節約）
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # 料金表の版チェックで比較元のコミットを見るため

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 構文チェック（全JSファイル）
        run: |
          set -e
          for f in keitai-app/*.js *.js ienaka-app/*.js ienaka-demo/*.js; do
            [ -e "$f" ] || continue
            node --check "$f"
            echo "ok: $f"
          done

      - name: Playwright を準備
        run: |
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright >/dev/null 2>&1
          npx playwright install --with-deps chromium

      - name: 金額計算のゴールデンテスト
        run: node tests/run-calc-tests.js
      - name: 請求内訳の読み取りテスト
        run: node tests/run-bill-tests.js
      - name: 光・5G（イエナカ）の金額テスト
        run: node tests/run-ienaka-tests.js
      - name: 料金表の配信（受付終了）のテスト
        run: node tests/run-master-update-tests.js
      - name: 古い保存データの読み直しのテスト
        run: node tests/run-migrate-tests.js
      - name: 案内文の確認（実在しない場所へ案内していないか）
        run: node tests/run-wording-tests.js
      - name: 端末どうしの同期（見積もりが消えないか）
        run: node tests/run-sync-tests.js
      - name: 調子が悪いときの情報（診断）のテスト
        run: node tests/run-diag-tests.js
      - name: 触って使う機器（iPad・iPhone）の確認
        run: node tests/run-touch-tests.js
      - name: 回線と成約の数え方のテスト
        run: node tests/run-lines-tests.js
      - name: 端末マスタ（機種の一覧）の取り込みのテスト
        run: node tests/run-device-master-tests.js
      - name: テンプレートのテスト
        run: node tests/run-template-tests.js
      - name: 作業ルール（CLAUDE.md と AGENTS.md）がズレていないか
        run: node tools/build-agents.js --check
      - name: 出荷用（独自ドメイン版）の並びの確認
        run: node tests/run-product-layout-test.js
      - name: 社内版の配信物（許可リスト・入れすぎ・控え一覧）の確認
        run: node tests/run-internal-layout-test.js
      - name: 配信ジョブの決まり（Node の版・秘密の置き場）
        run: node tests/run-ci-config-test.js
      - name: きれいな住所への転送に耐えるか（控えの作成・圏外での起動）
        run: node tests/run-pretty-url-test.js
      - name: 空の端末が本番を白紙にしないこと・引っ越し済みの合図
        run: node tests/run-fresh-tests.js
      - name: 引っ越し（持ち出し・持ち込み）
        run: node tests/run-move-tests.js
      - name: 旧住所の案内ページ（オフライン係の片付け）
        run: node tests/run-oldsite-stub-test.js

      # ルールを1文字間違えると全店舗が止まる／他店が見える（レビュー4-25）
      - name: Java 21 を用意（Firestore エミュレータが要求）
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Firestore ルールのテスト
        run: |
          npm install --no-audit --no-fund --no-save @firebase/rules-unit-testing firebase-tools firebase-admin >/dev/null
          npx --no-install firebase-tools emulators:exec --only firestore --project demo-frontalk \
            "node tests/rules/run-rules-tests.js"

      # 店舗の開通スクリプト（本番の鍵は使わず、エミュレータで手順どおりに流す・レビュー4-24）
      - name: 店舗の開通スクリプトのテスト
        run: |
          npx --no-install firebase-tools emulators:exec --only auth,firestore --project demo-frontalk \
            "node tests/run-provision-tests.js"

      # 料金表を変えたのに版を上げ忘れると、店舗に改定が届かない（レビュー4-10）
      - name: 料金表を変えたら版と基準日も上げているか
        if: github.event_name == 'pull_request'
        run: node tools/check-master-version.js "${{ github.event.pull_request.base.sha }}"

      # 版・キャッシュ名・更新履歴・生成物の食い違いを止める（レビュー4-33）
      - name: リリースの決まり（版の一致・キャッシュ名・生成物の鮮度）
        if: github.event_name == 'pull_request'
        run: node tools/release-check.js "${{ github.event.pull_request.base.sha }}"

  # ── 配信（Cloudflare Pages）────────────────────────────────
  # main に入った版を、上のテストが**全部通ったあとだけ**配る。製品版と社内版は別のプロジェクト。
  # 秘密（合鍵）は GitHub の Environment「production」に置く（Settings → Environments →
  # production → Deployment branches を main だけに限定 → Environment secrets に
  # CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID / CF_PAGES_PROJECT_INTERNAL / CHECK_LIVE_INTERNAL_URL）。
  # Repository secrets には置かない。※Environment の枝制限と秘密は、Private リポジトリでは GitHub Pro 以上でしか効かない。
  # 社内版のプロジェクト名と住所も secrets に置く（Variables は自動実行の記録（ログ）に平文で出て、
  # 公開リポジトリのログはログインした人なら誰でも読めるため。secrets なら伏せ字になる）。
  # 配るかどうかは Variables の DEPLOY_ENABLED（"true" のときだけ）。住所の切替の日は false にして止める。
  # 製品版の名前は公開情報なので Variables の CF_PAGES_PROJECT_PRODUCT でよい。
  deploy:
    needs: test
    # main 以外の枝からは配らない（手動実行でも）。Environment の枝制限が効かない契約でも、ここで止まる
    if: ${{ (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main' && vars.DEPLOY_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # wrangler 4.x は Node 22 以上を要求する（20 だと起動せず配信が止まる）
          node-version: 22
      - name: 合鍵がそろっているか
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CF_PAGES_PROJECT_INTERNAL: ${{ secrets.CF_PAGES_PROJECT_INTERNAL }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "Cloudflare の合鍵（Environment secrets）が未登録のため、配信は行いません"; exit 1
          fi
          [ -n "${{ vars.CF_PAGES_PROJECT_PRODUCT }}" ] || { echo "CF_PAGES_PROJECT_PRODUCT（Variables）が未設定"; exit 1; }
          [ -n "$CF_PAGES_PROJECT_INTERNAL" ] || { echo "CF_PAGES_PROJECT_INTERNAL（Environment secrets）が未設定"; exit 1; }
      - name: 配信物を作る（製品版・社内版）
        run: |
          node tools/build-product.js dist-product
          node tools/build-internal-dist.js dist-internal
          # 配るものが、いまテストした commit そのものであること（version.json で照合できるようにする）
          node -e '
            const v=require("./dist-product/version.json"), w=require("./dist-internal/version.json");
            const sha=process.env.GITHUB_SHA;
            if (v.commit!==sha||w.commit!==sha||v.dirty||w.dirty) { console.error("version.json の commit が一致しません", v, w, sha); process.exit(1); }
            console.log("配る版:", v.app, "commit:", sha);'
      - name: 社内版を配る（阪南が先に踏む）
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CF_PAGES_PROJECT_INTERNAL: ${{ secrets.CF_PAGES_PROJECT_INTERNAL }}
        run: npx --yes wrangler@4.130.0 pages deploy dist-internal --project-name "$CF_PAGES_PROJECT_INTERNAL" --branch main --commit-hash "$GITHUB_SHA" --commit-dirty=false
      - name: 製品版を配る
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4.130.0 pages deploy dist-product --project-name "${{ vars.CF_PAGES_PROJECT_PRODUCT }}" --branch main --commit-hash "$GITHUB_SHA" --commit-dirty=false
      - name: 配ったものを確かめる（製品版）
        if: ${{ vars.CHECK_LIVE_PRODUCT_URL != '' }}
        run: sleep 20 && node tools/check-live.js "${{ vars.CHECK_LIVE_PRODUCT_URL }}" --commit "$GITHUB_SHA"
      - name: 配ったものを確かめる（社内版。住所は secrets に置くので記録には伏せ字で出る）
        env:
          CHECK_LIVE_INTERNAL_URL: ${{ secrets.CHECK_LIVE_INTERNAL_URL }}
        run: |
          if [ -z "$CHECK_LIVE_INTERNAL_URL" ]; then echo "CHECK_LIVE_INTERNAL_URL が未設定のため、社内版の確認は飛ばします"; exit 0; fi
          node tools/check-live.js "$CHECK_LIVE_INTERNAL_URL" --internal --commit "$GITHUB_SHA"
